[project]
name = "scrapekit"
version = "0.1.0"
description = "Polite, source-pluggable crawler that turns public-sector websites and their linked files into versioned, sourced records."
readme = "README.md"
authors = [
    { name = "Mona A", email = "muna.alkhateeb@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "selectolax>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
scrapekit = "scrapekit.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:importlib"]
